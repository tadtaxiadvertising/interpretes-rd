# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: ⏰ Cron — Shift Reminders

# Invokes the CRON_SECRET-protected endpoint on a schedule.
# The endpoint fails closed (401) when CRON_SECRET is not configured, so this
# workflow safely no-ops until the `CRON_SECRET` repository secret is set.
on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  shift-reminders:
    name: Trigger shift reminders
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/shift-reminders
        run: |
          set -euo pipefail
          TARGET_URL="${CRON_TARGET_URL:-https://interpretes.rd.ibusiness.com.do/api/cron/shift-reminders}"
          TARGET_URL="$(printf '%s' "$TARGET_URL" | tr -d '\r\n')"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "⚠️ WARNING: CRON_SECRET secret is not configured."
            echo "Skipping. Add the CRON_SECRET repository secret (Settings > Secrets > Actions) to enable this job."
            exit 0
          fi
          echo "Triggering shift reminders at $TARGET_URL ..."
          HTTP_CODE=$(curl -s -o /tmp/body -w "%{http_code}" \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$TARGET_URL")
          echo "Response body:"; cat /tmp/body || true; echo
          case "$HTTP_CODE" in
            200|201|202|204) echo "OK: shift reminders triggered (HTTP $HTTP_CODE)";;
            *) echo "FAIL: cron endpoint returned HTTP $HTTP_CODE"; exit 1;;
          esac
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ vars.CRON_TARGET_URL }}
