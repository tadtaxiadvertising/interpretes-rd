# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: ⏰ Cron — Shift Reminders

# Intentionally manual-only until shift reminder delivery is implemented.
# The authenticated endpoint currently returns HTTP 501
# (SHIFT_REMINDERS_NOT_CONFIGURED), so scheduling this every 30 minutes only
# creates recurring failures without sending a single notification.
# Re-enable schedule only after issue #381 has a verified delivery provider,
# idempotency, opt-out handling, timezone logic and production smoke tests.
# Manual dispatch remains available and will fail visibly with 501 while
# the feature is not implemented. Never treat this as a successful delivery.
on:
  workflow_dispatch:

jobs:
  shift-reminders:
    name: Trigger shift reminders
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/shift-reminders
        run: |
          set -euo pipefail
          TARGET_URL="${CRON_TARGET_URL:-https://interpretes.rd.ibusiness.com.do/api/cron/shift-reminders}"
          TARGET_URL="$(printf '%s' "$TARGET_URL" | tr -d '\r\n')"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "⚠️ WARNING: CRON_SECRET secret is not configured."
            echo "Skipping. Add the CRON_SECRET repository secret (Settings > Secrets > Actions) to enable this job."
            exit 0
          fi
          echo "Triggering shift reminders at $TARGET_URL ..."
          HTTP_CODE=$(curl -s -o /tmp/body -w "%{http_code}" \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$TARGET_URL")
          echo "Response body:"; cat /tmp/body || true; echo
          case "$HTTP_CODE" in
            200|201|202|204) echo "OK: shift reminders triggered (HTTP $HTTP_CODE)";;
            *) echo "FAIL: cron endpoint returned HTTP $HTTP_CODE"; exit 1;;
          esac
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_TARGET_URL: ${{ vars.CRON_TARGET_URL }}
