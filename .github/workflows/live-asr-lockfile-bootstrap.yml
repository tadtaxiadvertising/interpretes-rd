# Temporary branch-scoped lockfile bootstrap. Remove this workflow before merge.
name: Bootstrap Live ASR package lockfile
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/live-asr-lockfile-bootstrap.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/live-whisper-tiny-wasm-pilot-20261116' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact dependency graph (without scripts)
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Commit changed lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(live): synchronize Transformers.js lockfile'
          git push origin HEAD:refs/heads/feat/live-whisper-tiny-wasm-pilot-20261116
