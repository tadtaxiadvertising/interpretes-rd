name: Verify audited Express candidate in Docker (isolated)
on:
  pull_request:
    paths:
      - '.github/workflows/api-candidate-runtime.yml'
      - 'Dockerfile.api'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: api-candidate-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: api-dependency-candidates
          run-id: 45858835930
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/audited-api
      - name: Verify exact audited manifests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/audited-api/patched"
          printf '%s\n' 'b1aac2e47a099e0083139126e5f82f088ea26d989074a9b156aafcee5b20e207  package.json' 'aec09be97da968ea4d4d163c693a8d9998ecc9d81ba0363aecd74c60cdd17f3e  package-lock.json' | sha256sum --check
          cp package.json package-lock.json "$GITHUB_WORKSPACE/interpreters-api/"
      - name: Build candidate with actual API Dockerfile
        run: docker build --file Dockerfile.api --tag interpreters-api:candidate .
      - name: Verify existing password hash compatibility and runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --entrypoint node interpreters-api:candidate --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import bcrypt from 'bcrypt';
          import express from 'express';
          import { z } from 'zod';
          import { PrismaClient } from '@prisma/client';
          import { PrismaPg } from '@prisma/adapter-pg';
          const password = 'Synthetic-Auth-Compatibility-2026!';
          for (const hash of [
            '$2a$10$abcdefghijklmnopqrstuuVXbUTOOH4bACvrZgQpeM.CiieeH/v02',
            '$2b$10$abcdefghijklmnopqrstuuVXbUTOOH4bACvrZgQpeM.CiieeH/v02',
          ]) {
            assert.equal(await bcrypt.compare(password, hash), true);
            assert.equal(await bcrypt.compare('wrong-password', hash), false);
          }
          const generated = await bcrypt.hash(password, 10);
          assert.equal(bcrypt.getRounds(generated), 10);
          assert.equal(await bcrypt.compare(password, generated), true);
          assert.equal(typeof express, 'function');
          assert.equal(z.string().parse('synthetic'), 'synthetic');
          assert.equal(typeof PrismaClient, 'function');
          assert.equal(typeof PrismaPg, 'function');
          assert.equal(process.getuid(), 1001, 'API must run as non-root');
          console.log('Candidate native password compatibility and runtime imports passed.');
          JS
      - name: Report isolated candidate validation
        run: echo 'Verified exact audited candidate in API Docker image; no production connection or publication.' >> "$GITHUB_STEP_SUMMARY"
