name: Repair account VPN schema (manual, no deployment)

# Emergency schema-only repair for Prisma P2022 when normal deploy is blocked.
# This workflow never calls Easypanel webhooks and never builds/redeploys code.
on:
  workflow_dispatch:
    inputs:
      backup_and_target_confirmed:
        description: 'Confirm reviewed backup and exact production database target'
        required: true
        type: choice
        options:
          - 'NO'
          - 'CONFIRMO_BACKUP_Y_DESTINO_PRODUCCION'

permissions:
  contents: read

# Share the production deploy lock. A schema repair must not race with a
# deployment workflow on main, including a pending deployment retry.
concurrency:
  group: interpreters-cicd-refs/heads/main
  cancel-in-progress: false

jobs:
  repair-account-vpn-schema:
    name: Controlled VPN schema repair only
    # INCIDENT FREEZE: even confirmed manual requests must not mutate the
    # production database until the Easypanel/VPS incident is resolved.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require direct database credential and operator backup confirmation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DIRECT_URL:-}" || { echo 'Production DIRECT_URL is missing'; exit 1; }
          echo 'Backup/target confirmation received. No database URL will be printed.'

      - name: Install dependencies without GPU binary
        run: npm_config_onnxruntime_node_install=skip npm ci --legacy-peer-deps

      - name: Inspect current VPN schema without modifying the database
        run: npx tsx scripts/ensure-account-platform-vpn-migration.ts --check-only

      # Executes the *existing* additive VPN migration only when 100% absent;
      # refuses partially applied or incompatible databases. One transaction.
      - name: Apply reviewed VPN schema migration only
        run: npx tsx scripts/ensure-account-platform-vpn-migration.ts

      - name: Verify all VPN columns and constraint read-only
        run: npx tsx scripts/ensure-account-platform-vpn-migration.ts --require-complete

      # Never issue an Easypanel webhook: the installed version will pick up
      # these additive columns on its next database request.
