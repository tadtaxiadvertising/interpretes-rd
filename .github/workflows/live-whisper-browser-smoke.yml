name: Live Whisper Chromium model smoke (isolated)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/live-whisper-smoke/**'
      - '.github/workflows/live-whisper-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-asr-smoke:
    # Avoid running model-weight downloads from untrusted fork PRs.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: Real model load + inference in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      FI_LIVE_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install pinned dependencies
        run: npm ci --legacy-peer-deps
      - name: Self-host pinned ONNX Runtime WASM files
        run: npm run prepare:live-wasm
      - name: Install selected Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Execute browser-only Whisper smoke and measure inference
        # Synthetic PCM only. No credentials, personal content or microphones.
        # Uses a production-like Vite build, not the authenticated app.
        run: node scripts/live-whisper-smoke/run.mjs
      - name: Upload sanitized per-browser latency measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ matrix.browser }}-latency
          path: test-results/whisper-${{ matrix.browser }}-metrics.json
          if-no-files-found: ignore
          retention-days: 14
