# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: 🚀 CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep migrations, frontend and backend deployments on main serialized;
# never cancel a production migration. PR checks are isolated from production:
# discard superseded validation runs when a branch receives a newer commit.
concurrency:
  group: interpreters-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: interpreters_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d interpreters_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interpreters_e2e?schema=public&sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/interpreters_e2e?schema=public&sslmode=disable
      AUTH_SECRET: e2e-only-secret-for-isolated-ci-testing-2026
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      E2E_ALLOW_RUN: 'true'
      E2E_ALLOW_DB_CLEANUP: 'true'
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interpreters_e2e
      E2E_START_SERVER: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # CI runs CPU/WebAssembly inference only. Avoid downloading the CUDA
      # NuGet package during onnxruntime-node's postinstall: that unused GPU
      # dependency caused intermittent ETIMEDOUT failures on api.nuget.org.
      - name: Install dependencies
        run: npm_config_onnxruntime_node_install=skip npm ci --legacy-peer-deps

      - name: Verify ONNX Runtime CPU binding
        run: node -e "const ort = require('onnxruntime-node'); if (typeof ort.InferenceSession?.create !== 'function') process.exit(1)"

      # Validate the deployment safety guard even while a supply-chain advisory
      # blocks the broader pipeline. This does NOT bypass the audit gate.
      - name: Verify VPN migration guard regression tests
        run: npx vitest run scripts/account-platform-vpn-schema.test.ts

      # Run the exact migration runner on disposable localhost PostgreSQL:
      # initial application, repeat no-op, partial schema, and forged CHECK.
      # Production URLs are rejected by the verifier, and no SQL is deployed.
      - name: Verify VPN migration guard on isolated PostgreSQL
        env:
          CI: 'true'
        run: npx tsx scripts/verify-account-platform-vpn-guard.ts

      # Secret storage and the opt-in MP3 proxy need explicit regression
      # evidence even while the upstream advisory blocks broader CI.
      # This never bypasses or relaxes the supply-chain audit.
      - name: Verify HappyScribe encrypted settings and admin permissions
        run: npx vitest run src/lib/roleplay/happyscribe-settings.test.ts src/app/actions/__tests__/audio-studio-settings.test.ts
      # Check bounded provider responses and ID-scoped SRT/MP3 imports even
      # when the unchanged dependency audit blocks full TypeScript/build.
      - name: Verify HappyScribe bounded probe and private import routes
        run: npx vitest run src/lib/roleplay/happyscribe-probe.test.ts src/lib/roleplay/happyscribe-import-proof.test.ts src/app/api/admin/happyscribe/transcriptions/route.test.ts src/app/api/admin/happyscribe/media/route.test.ts
      # Lock down the legacy QA response contract while directing API
      # consumers to verified, paginated ProductionLog review status.
      # This test does not bypass the unchanged supply-chain audit gate.
      - name: Verify QA legacy pending deprecation contract
        run: npx vitest run src/app/api/v1/qa/pending/__tests__/route.test.ts
      # Preserve a focused privacy regression check even when an upstream
      # dependency advisory blocks the full validation pipeline.
      - name: Verify call action error redaction
        run: npx vitest run src/app/actions/__tests__/calls-error-redaction.test.ts src/app/api/v1/calls/manual/__tests__/route.test.ts
      # Verify that archive/restore responses stay accurate after a committed
      # write even if Next.js cache invalidation subsequently throws.
      # The audit remains a hard gate; this unit test does not enable deploys.
      - name: Verify Roleplay library post-commit regression tests
        run: npx vitest run 'src/app/api/admin/roleplays/library/[fingerprint]/__tests__/route.test.ts'

      # Exercise financial-response privacy before the supply-chain audit.
      # The audit remains mandatory; these tests do not authorize deployment.
      - name: Verify financial API privacy regressions
        run: npx vitest run src/app/api/v1/payroll/__tests__/financial-privacy.test.ts src/lib/api-responses.security.test.ts

      # Confirm an unanchored biweekly schedule cannot trigger payroll writes.
      # This is independent regression evidence; supply-chain audit remains a hard gate.
      - name: Verify biweekly payroll fail-closed guard
        run: npx vitest run src/app/api/v1/payroll/__tests__/biweekly-schedule-guard.test.ts

      # A legacy replay must never double-count already accounted calls.
      # This test does not bypass the mandatory dependency audit.
      - name: Verify legacy call sync is non-mutating
        run: npx vitest run src/app/api/calls/sync/__tests__/route.test.ts

      # Financial reconciliation must be atomic and reject settled/paid rows.
      # The supply-chain audit remains mandatory and still blocks deployment.
      - name: Verify transactional payroll reconciliation guards
        run: npx vitest run src/lib/payroll/reconcile-production-minutes.test.ts src/app/api/reconcile/__tests__/route.test.ts src/app/actions/__tests__/payroll-reconcile-shared-guard.test.ts src/services/PayrollService.refresh.test.ts

      # Verify the CSP explicitly substitutes only validated HTTPS origins.
      # Keep the mandatory supply-chain gate unchanged after this regression.
      - name: Verify custom CSP origin safety
        run: npx vitest run src/lib/security/next-config-csp.test.ts

      - name: Dependency Security Audit
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const report = require(process.env.RUNNER_TEMP + "/npm-audit.json");
            const vulnerabilities = report.vulnerabilities || {};
            console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities || {}));
            const severity = report.metadata?.vulnerabilities || {};
            if ((severity.high || 0) > 0 || (severity.critical || 0) > 0) {
              console.error("Dependency audit blocked: high/critical vulnerabilities must be resolved.");
              process.exitCode = 1;
            } else if ((severity.moderate || 0) > 0) {
              console.warn("Dependency audit warning: moderate vulnerabilities remain; review and remediate.");
            }
            for (const [name, item] of Object.entries(vulnerabilities)) {
              const advisories = (item.via || [])
                .filter((entry) => typeof entry === "object")
                .map((entry) => entry.title + (entry.url ? " (" + entry.url + ")" : ""));
              console.log([
                name,
                "severity=" + item.severity,
                "direct=" + item.isDirect,
                "range=" + item.range,
                "fixAvailable=" + JSON.stringify(item.fixAvailable),
                "via=" + JSON.stringify(item.via || []),
                "effects=" + JSON.stringify(item.effects || []),
                "advisories=" + advisories.join("; ")
              ].join(" | "));
            }
          '

      - name: Prisma Validate
        run: npx prisma validate

      - name: Prisma Generate
        run: npx prisma generate

      - name: Prepare isolated E2E database
        run: npx prisma db push

      - name: Verify roleplay library archive migration on isolated PostgreSQL
        run: npx tsx scripts/verify-roleplay-library-archive-migration.ts

      - name: Verify Roleplay Studio metadata migration on isolated PostgreSQL
        run: npx tsx scripts/verify-roleplay-studio-metadata-migration.ts

      - name: Verify critical legal and Roleplay migrations
        run: npx tsx scripts/verify-critical-migrations.ts

      - name: Verify operational migrations on isolated PostgreSQL
        run: npx tsx scripts/verify-operational-migrations.ts

      - name: Verify call production ledger migration on isolated PostgreSQL
        run: npx tsx scripts/verify-call-production-ledger-migration.ts

      - name: Verify deployment preflight on isolated PostgreSQL
        env:
          EASYPANEL_WEBHOOK_INTERPRETERS: http://127.0.0.1:9/unused-frontend
          EASYPANEL_WEBHOOK_API: http://127.0.0.1:9/unused-backend
        run: npx tsx scripts/deployment-preflight.ts

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Audit Script TypeScript Check
        run: npm run typecheck:audit

      - name: Maintenance Scripts TypeScript Check
        run: npm run typecheck:scripts

      - name: ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Test runtime release SHA verifier
        run: node --test scripts/ci/verify-easypanel-version.test.mjs scripts/ci/verify-easypanel-workflow.test.mjs

      - name: Verify local long-video FFmpeg export
        run: |
          node --check scripts/export-studio-long-local.mjs
          node --test scripts/export-studio-long-local.test.mjs

      - name: Build
        run: npm run build

      # A successful Next build does not prove a runtime binary was copied
      # into the standalone distribution. Check the exact route dependency.
      - name: Verify standalone Audio Studio FFmpeg
        run: |
          test -x .next/standalone/node_modules/ffmpeg-static/ffmpeg
          .next/standalone/node_modules/ffmpeg-static/ffmpeg -hide_banner -version >/dev/null

      # The Easypanel "interpreters-api" service must run the standalone
      # Express backend. Validate its actual Dockerfile, not only Next.js.
      - name: Build dedicated interpreters-api backend image
        run: docker build --file Dockerfile.api --tag interpreters-api:ci .

      - name: Build dedicated Roleplay audio worker image
        run: docker build --file Dockerfile.worker --tag roleplay-audio-worker:ci .

      - name: Prepare standalone static assets for E2E
        run: |
          # Next.js standalone output intentionally omits these directories.
          # Copy them so the browser can load the client bundles and hydrate Client Components.
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -a public .next/standalone/public
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated end-to-end tests
        run: npm run test:e2e

  deploy-interpreters:
    name: Deploy interpreters (Next.js)
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      is_current: ${{ steps.recheck_head.outputs.current }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check main HEAD before database operations
        id: check_head
        run: bash scripts/ci/check-current-main-head.sh

      - name: Setup Node.js
        if: steps.check_head.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install migration dependencies
        if: steps.check_head.outputs.current == 'true'
        run: npm_config_onnxruntime_node_install=skip npm ci --legacy-peer-deps

      - name: Preflight production credentials and read-only connection
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EASYPANEL_WEBHOOK_INTERPRETERS: ${{ secrets.EASYPANEL_WEBHOOK_INTERPRETERS }}
          EASYPANEL_WEBHOOK_API: ${{ secrets.EASYPANEL_WEBHOOK_API }}
        run: npx tsx scripts/deployment-preflight.ts

      - name: Apply client directory migration before ownership constraints
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261105140000_client_directory/migration.sql --apply --transaction

      - name: Apply account ownership migration
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261105150000_account_names_per_client/migration.sql --apply --transaction

      - name: Apply canonical client directory constraints
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261105180000_client_directory/migration.sql --apply --transaction

      - name: Apply Roleplay audio conversion queue migration
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261108143000_roleplay_audio_job_queue/migration.sql --apply --transaction

      - name: Apply Roleplay base audio path migration
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261108170000_roleplay_base_audio_path/migration.sql --apply --transaction

      - name: Apply operational account holder details migration
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261108120000_operational_account_holder_details/migration.sql --apply --transaction

      - name: Apply per-session call production ledger migration
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261111090000_call_production_ledger/migration.sql --apply --transaction

      - name: Apply roleplay library archive migration
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261112220000_roleplay_library_archives/migration.sql --apply --transaction

      - name: Apply Roleplay Studio turn metadata migration
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261114233000_roleplay_studio_turn_metadata/migration.sql --apply --transaction

      - name: Apply account platform VPN configuration migration
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/ensure-account-platform-vpn-migration.ts

      - name: Verify production client directory schema after migrations
        if: steps.check_head.outputs.current == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EASYPANEL_WEBHOOK_INTERPRETERS: ${{ secrets.EASYPANEL_WEBHOOK_INTERPRETERS }}
          EASYPANEL_WEBHOOK_API: ${{ secrets.EASYPANEL_WEBHOOK_API }}
        run: npx tsx scripts/deployment-preflight.ts --verify-schema

      - name: Recheck main HEAD before Easypanel webhook
        id: recheck_head
        if: steps.check_head.outputs.current == 'true'
        run: bash scripts/ci/check-current-main-head.sh

      - name: Call Easypanel Webhook — interpreters
        if: steps.recheck_head.outputs.current == 'true'
        run: |
          set -euo pipefail
          echo "Deploying interpreters (Next.js) to Easypanel..."
          WEBHOOK_URL="${EASYPANEL_WEBHOOK_INTERPRETERS:-}"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::EASYPANEL_WEBHOOK_INTERPRETERS secret is not configured."
            echo "Deployment cannot proceed without the required Easypanel webhook secret."
            exit 1
          fi
          if ! printf '%s' "$WEBHOOK_URL" | grep -Eq '^https?://'; then
            echo "ERROR: EASYPANEL_WEBHOOK_INTERPRETERS must be a valid URL starting with http:// or https://."
            exit 78
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors -X POST "$WEBHOOK_URL")
          case "$HTTP_CODE" in 200|201|202|204) echo "OK: webhook interpreters aceptado (HTTP $HTTP_CODE); despliegue y SHA no verificados"; printf 'Interpreters: solicitud aceptada HTTP %s; imagen en ejecución no verificada.\n' "$HTTP_CODE" >> "${GITHUB_STEP_SUMMARY:-/dev/null}";; *) echo "FAIL: interpreters webhook returned HTTP $HTTP_CODE"; exit 1;; esac
        env:
          EASYPANEL_WEBHOOK_INTERPRETERS: ${{ secrets.EASYPANEL_WEBHOOK_INTERPRETERS }}

  deploy-roleplay-audio-worker:
    name: Deploy Roleplay audio worker (optional)
    needs: [validate, deploy-interpreters]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_ROLEPLAY_AUDIO_WORKER == 'true' && needs.deploy-interpreters.outputs.is_current == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check main HEAD before worker webhook
        id: head
        run: bash scripts/ci/check-current-main-head.sh

      - name: Call Easypanel Webhook — Roleplay audio worker
        if: steps.head.outputs.current == 'true'
        env:
          EASYPANEL_WEBHOOK_ROLEPLAY_WORKER: ${{ secrets.EASYPANEL_WEBHOOK_ROLEPLAY_WORKER }}
        run: |
          set -euo pipefail
          echo "Deploying Roleplay audio worker to Easypanel..."
          WEBHOOK_URL="$(printf '%s' "${EASYPANEL_WEBHOOK_ROLEPLAY_WORKER:-}" | tr -d '\r\n')"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::EASYPANEL_WEBHOOK_ROLEPLAY_WORKER is required when ENABLE_ROLEPLAY_AUDIO_WORKER=true."
            exit 1
          fi
          if ! printf '%s' "$WEBHOOK_URL" | grep -Eq '^https?://'; then
            echo "::error::EASYPANEL_WEBHOOK_ROLEPLAY_WORKER must be a valid HTTP(S) URL."
            exit 78
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors -X POST "$WEBHOOK_URL")
          case "$HTTP_CODE" in 200|201|202|204) echo "OK: webhook Roleplay worker aceptado (HTTP $HTTP_CODE); readiness y SHA no verificados"; printf 'Roleplay worker: solicitud aceptada HTTP %s; contenedor no verificado.\n' "$HTTP_CODE" >> "${GITHUB_STEP_SUMMARY:-/dev/null}";; *) echo "FAIL: Roleplay worker webhook returned HTTP $HTTP_CODE"; exit 1;; esac

  deploy-interpreters-api:
    name: Deploy interpreters-api (Backend)
    needs: [validate, deploy-interpreters]
    if: github.ref == 'refs/heads/main' && needs.deploy-interpreters.outputs.is_current == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check main HEAD before backend webhook
        id: head
        run: bash scripts/ci/check-current-main-head.sh

      - name: Call Easypanel Webhook — interpreters-api
        if: steps.head.outputs.current == 'true'
        run: |
          set -euo pipefail
          echo "Deploying interpreters-api (Backend) to Easypanel..."
          WEBHOOK_URL="${EASYPANEL_WEBHOOK_API:-}"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::EASYPANEL_WEBHOOK_API secret is not configured."
            echo "Deployment cannot proceed without the required Easypanel webhook secret."
            exit 1
          fi
          if ! printf '%s' "$WEBHOOK_URL" | grep -Eq '^https?://'; then
            echo "ERROR: EASYPANEL_WEBHOOK_API must be a valid URL starting with http:// or https://."
            exit 78
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors -X POST "$WEBHOOK_URL")
          case "$HTTP_CODE" in 200|201|202|204) echo "OK: webhook interpreters-api aceptado (HTTP $HTTP_CODE); despliegue y SHA no verificados"; printf 'Interpreters API: solicitud aceptada HTTP %s; imagen en ejecución no verificada.\n' "$HTTP_CODE" >> "${GITHUB_STEP_SUMMARY:-/dev/null}";; *) echo "FAIL: interpreters-api webhook returned HTTP $HTTP_CODE"; exit 1;; esac
        env:
          EASYPANEL_WEBHOOK_API: ${{ secrets.EASYPANEL_WEBHOOK_API }}

  # Verify the frontend only AFTER API/worker webhook dependencies are allowed
  # to proceed. A missing Docker GIT_SHA must mark the release unverifiable
  # without suppressing the remaining service deployment requests.
  verify-easypanel-frontend:
    name: Verify live Easypanel frontend SHA (opt-in)
    needs: [validate, deploy-interpreters, deploy-interpreters-api, deploy-roleplay-audio-worker]
    # The worker is optional. A skipped worker must not skip verification,
    # but a failed worker must still leave this release incomplete.
    if: >-
      ${{
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        needs.validate.result == 'success' &&
        needs.deploy-interpreters.result == 'success' &&
        needs.deploy-interpreters-api.result == 'success' &&
        (needs.deploy-roleplay-audio-worker.result == 'success' ||
          needs.deploy-roleplay-audio-worker.result == 'skipped') &&
        needs.deploy-interpreters.outputs.is_current == 'true'
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check main HEAD before live version verification
        id: verify_head
        run: bash scripts/ci/check-current-main-head.sh

      # A 2xx webhook does not confirm the new container is serving traffic.
      # Gradual opt-in: configure the production environment variable and
      # ensure Easypanel passes the source SHA as the Docker GIT_SHA build arg.
      - name: Verify live Easypanel frontend SHA (opt-in)
        if: steps.verify_head.outputs.current == 'true'
        env:
          EASYPANEL_RELEASE_VERIFY_URL: ${{ vars.EASYPANEL_RELEASE_VERIFY_URL }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${EASYPANEL_RELEASE_VERIFY_URL:-}" ]; then
            echo "::warning::Easypanel release SHA NOT verified: configure EASYPANEL_RELEASE_VERIFY_URL and Docker GIT_SHA to enable runtime attestation."
            echo "Easypanel frontend SHA: unverified (no public verification URL configured)." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            node scripts/ci/verify-easypanel-version.mjs
          fi

