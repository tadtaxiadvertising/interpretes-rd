# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: 🚀 CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Keep migration, frontend and backend from different main runs from interleaving.
# Never cancel a running migration. PR validation uses its own ref/group.
concurrency:
  group: interpreters-cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: interpreters_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d interpreters_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interpreters_e2e?schema=public&sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/interpreters_e2e?schema=public&sslmode=disable
      AUTH_SECRET: e2e-only-secret-for-isolated-ci-testing-2026
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      E2E_ALLOW_RUN: 'true'
      E2E_ALLOW_DB_CLEANUP: 'true'
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interpreters_e2e
      E2E_START_SERVER: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Dependency Security Audit
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const report = require(process.env.RUNNER_TEMP + "/npm-audit.json");
            const vulnerabilities = report.vulnerabilities || {};
            console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities || {}));
            const severity = report.metadata?.vulnerabilities || {};
            if ((severity.high || 0) > 0 || (severity.critical || 0) > 0) {
              console.error("Dependency audit blocked: high/critical vulnerabilities must be resolved.");
              process.exitCode = 1;
            } else if ((severity.moderate || 0) > 0) {
              console.warn("Dependency audit warning: moderate vulnerabilities remain; review and remediate.");
            }
            for (const [name, item] of Object.entries(vulnerabilities)) {
              const advisories = (item.via || [])
                .filter((entry) => typeof entry === "object")
                .map((entry) => entry.title + (entry.url ? " (" + entry.url + ")" : ""));
              console.log([
                name,
                "severity=" + item.severity,
                "direct=" + item.isDirect,
                "range=" + item.range,
                "fixAvailable=" + JSON.stringify(item.fixAvailable),
                "via=" + JSON.stringify(item.via || []),
                "effects=" + JSON.stringify(item.effects || []),
                "advisories=" + advisories.join("; ")
              ].join(" | "));
            }
          '

      - name: Prisma Validate
        run: npx prisma validate

      - name: Prisma Generate
        run: npx prisma generate

      - name: Prepare isolated E2E database
        run: npx prisma db push

      - name: Verify critical legal and Roleplay migrations
        run: npx tsx scripts/verify-critical-migrations.ts

      - name: Verify operational migrations on isolated PostgreSQL
        run: npx tsx scripts/verify-operational-migrations.ts

      - name: Verify deployment preflight on isolated PostgreSQL
        env:
          EASYPANEL_WEBHOOK_INTERPRETERS: http://127.0.0.1:9/unused-frontend
          EASYPANEL_WEBHOOK_API: http://127.0.0.1:9/unused-backend
        run: npx tsx scripts/deployment-preflight.ts

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Audit Script TypeScript Check
        run: npm run typecheck:audit

      - name: Maintenance Scripts TypeScript Check
        run: npm run typecheck:scripts

      - name: ESLint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build dedicated Roleplay audio worker image
        run: docker build --file Dockerfile.worker --tag roleplay-audio-worker:ci .

      - name: Prepare standalone static assets for E2E
        run: |
          # Next.js standalone output intentionally omits these directories.
          # Copy them so the browser can load the client bundles and hydrate Client Components.
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -a public .next/standalone/public
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated end-to-end tests
        run: npm run test:e2e

  deploy-interpreters:
    name: Deploy interpreters (Next.js)
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install migration dependencies
        run: npm ci --legacy-peer-deps

      - name: Preflight production credentials and read-only connection
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EASYPANEL_WEBHOOK_INTERPRETERS: ${{ secrets.EASYPANEL_WEBHOOK_INTERPRETERS }}
          EASYPANEL_WEBHOOK_API: ${{ secrets.EASYPANEL_WEBHOOK_API }}
        run: npx tsx scripts/deployment-preflight.ts

      - name: Apply client directory migration before ownership constraints
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261105140000_client_directory/migration.sql --apply --transaction

      - name: Apply account ownership migration
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261105150000_account_names_per_client/migration.sql --apply --transaction

      - name: Apply canonical client directory constraints
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run migrate -- prisma/migrations/20261105180000_client_directory/migration.sql --apply --transaction

      - name: Verify production client directory schema after migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EASYPANEL_WEBHOOK_INTERPRETERS: ${{ secrets.EASYPANEL_WEBHOOK_INTERPRETERS }}
          EASYPANEL_WEBHOOK_API: ${{ secrets.EASYPANEL_WEBHOOK_API }}
        run: npx tsx scripts/deployment-preflight.ts --verify-schema

      - name: Call Easypanel Webhook — interpreters
        run: |
          set -euo pipefail
          echo "Deploying interpreters (Next.js) to Easypanel..."
          WEBHOOK_URL="${EASYPANEL_WEBHOOK_INTERPRETERS:-}"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::EASYPANEL_WEBHOOK_INTERPRETERS secret is not configured."
            echo "Deployment cannot proceed without the required Easypanel webhook secret."
            exit 1
          fi
          if ! printf '%s' "$WEBHOOK_URL" | grep -Eq '^https?://'; then
            echo "ERROR: EASYPANEL_WEBHOOK_INTERPRETERS must be a valid URL starting with http:// or https://."
            exit 78
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors -X POST "$WEBHOOK_URL")
          case "$HTTP_CODE" in 200|201|202|204) echo "OK: interpreters deployed (HTTP $HTTP_CODE)";; *) echo "FAIL: interpreters webhook returned HTTP $HTTP_CODE"; exit 1;; esac
        env:
          EASYPANEL_WEBHOOK_INTERPRETERS: ${{ secrets.EASYPANEL_WEBHOOK_INTERPRETERS }}

  deploy-interpreters-api:
    name: Deploy interpreters-api (Backend)
    needs: [validate, deploy-interpreters]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call Easypanel Webhook — interpreters-api
        run: |
          set -euo pipefail
          echo "Deploying interpreters-api (Backend) to Easypanel..."
          WEBHOOK_URL="${EASYPANEL_WEBHOOK_API:-}"
          WEBHOOK_URL="$(printf '%s' "$WEBHOOK_URL" | tr -d '\r\n')"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::EASYPANEL_WEBHOOK_API secret is not configured."
            echo "Deployment cannot proceed without the required Easypanel webhook secret."
            exit 1
          fi
          if ! printf '%s' "$WEBHOOK_URL" | grep -Eq '^https?://'; then
            echo "ERROR: EASYPANEL_WEBHOOK_API must be a valid URL starting with http:// or https://."
            exit 78
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors -X POST "$WEBHOOK_URL")
          case "$HTTP_CODE" in 200|201|202|204) echo "OK: interpreters-api deployed (HTTP $HTTP_CODE)";; *) echo "FAIL: interpreters-api webhook returned HTTP $HTTP_CODE"; exit 1;; esac
        env:
          EASYPANEL_WEBHOOK_API: ${{ secrets.EASYPANEL_WEBHOOK_API }}
