name: Isolated roleplay Storage pilot
on:
  pull_request:
    paths:
      - '.github/workflows/roleplay-storage-pilot.yml'
      - 'scripts/ci/verify-roleplay-storage-pilot.ts'
      - 'src/lib/roleplay/direct-upload-*.ts'
      - 'src/lib/roleplay/admin-audio-extension.ts'
      - 'src/lib/roleplay-limits.ts'
      - 'docs/operations/staged-sql/roleplay-*.sql'
      - 'prisma/schema.prisma'
      - 'prisma.config.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roleplay-storage-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-storage:
    name: ${{ matrix.pilot }} Storage pilot
    strategy:
      fail-fast: false
      matrix:
        pilot: [provider, guarded]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ROLEPLAY_ISOLATED_STORAGE_PILOT: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned application dependencies
        run: npm_config_onnxruntime_node_install=skip npm ci --legacy-peer-deps
      - uses: supabase/setup-cli@v3
        with:
          # Candidate for #1118; baseline evidence is retained in #1120.
          version: '2.122.0'
      - name: Start fresh local Supabase only
        id: local-start
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase init --help >/dev/null
          supabase start --help >/dev/null
          supabase status --help >/dev/null
          pilot_dir="$RUNNER_TEMP/roleplay-storage-pilot"
          mkdir -m 700 "$pilot_dir"
          cd "$pilot_dir"
          supabase init
          # No link, remote token, migration, project credentials or secrets.
          supabase start -x studio,realtime,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta > "$pilot_dir/start.log" 2>&1
          umask 077
          supabase status -o json > "$pilot_dir/status.json" 2> "$pilot_dir/status.log"
      - name: Record isolated Storage and SDK versions
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node -e 'const p=require("./package-lock.json").packages; for(const [name,v] of Object.entries(p)) if(/(?:^|\/)node_modules\/@supabase\/(supabase-js|storage-js)$/.test(name)) console.log(name+" "+v.version)'
          mapfile -t storage_ids < <(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /(^|\/)storage-api[:@]/ {print $1}')
          if [ "${#storage_ids[@]}" -ne 1 ]; then
            echo "::warning::Could not uniquely identify the local Storage image"
          else
            docker inspect --format 'Storage image: {{.Config.Image}} ({{.Image}})' "${storage_ids[0]}"
          fi
      - name: Verify real local Storage API with synthetic fixtures
        if: ${{ matrix.pilot == 'provider' }}
        shell: bash
        run: |
          ROLEPLAY_LOCAL_STATUS_FILE="$RUNNER_TEMP/roleplay-storage-pilot/status.json" npx tsx scripts/ci/verify-roleplay-storage-pilot.ts
      # Each matrix job owns a fresh local stack; neither result masks the
      # other. The raw provider race remains a failing diagnostic.
      - name: Verify guarded writes with real Prisma and local Storage
        if: ${{ matrix.pilot == 'guarded' && steps.local-start.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          export DIRECT_URL="$DATABASE_URL"
          npx prisma generate
          ROLEPLAY_LOCAL_STATUS_FILE="$RUNNER_TEMP/roleplay-storage-pilot/status.json" npx vitest run src/lib/roleplay/direct-upload-guarded-storage.pilot.test.ts
      - name: Stop disposable local stack
        if: always()
        shell: bash
        run: |
          pilot_dir="$RUNNER_TEMP/roleplay-storage-pilot"
          if [ -d "$pilot_dir" ]; then
            cd "$pilot_dir"
            supabase stop --help >/dev/null
            supabase stop --no-backup > "$pilot_dir/stop.log" 2>&1 || exit 1
          fi
