name: Live Whisper Worker CSP build contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'next.config.ts'
      - 'next.config.test.ts'
      - 'src/modules/live-engine/core/whisper-tiny-client.ts'
      - 'scripts/ci/verify-live-whisper-csp-bundle.mjs'
      - '.github/workflows/live-whisper-csp-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-whisper-worker-csp:
    name: Whisper dedicated Worker + CSP HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: interpreters_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d interpreters_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # This is a PR-only sandbox build. Do NOT enable this flag in production.
      NEXT_PUBLIC_LIVE_WHISPER_PILOT_ENABLED: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interpreters_e2e?schema=public&sslmode=disable
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/interpreters_e2e?schema=public&sslmode=disable
      AUTH_SECRET: e2e-only-secret-for-isolated-ci-testing-2026
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install exact npm dependency graph
        run: npm ci --legacy-peer-deps
      - name: Build with experimental feature gate ONLY in isolated CI
        run: npm run build
      - name: Verify emitted named Worker and actual standalone CSP HTTP headers
        run: node scripts/ci/verify-live-whisper-csp-bundle.mjs
