name: 🔎 Roleplay audio inventory (read-only)

# No deletion option: all Storage reconciliation is read-only until issue
# #408 defines age-gated, concurrency-safe cleanup for recordings.
on:
  schedule:
    - cron: '0 3 * * 0' # Weekly, Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Read-only Roleplay audio inventory
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # The secrets context is not available in a job-level "if" expression.
      # Resolve optional credentials in a step and skip all work when absent.
      - name: Check audit credentials
        id: credentials
        run: |
          # The service-role key is optional for repositories that do not run
          # this audit. Once enabled, ALL three connections are mandatory.
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Roleplay audio inventory skipped: Storage audit not enabled."
            exit 0
          fi
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::error::Roleplay audio inventory configuration incomplete (DATABASE_URL and project URL required)."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.credentials.outputs.enabled == 'true'
        run: npm ci --legacy-peer-deps

      - name: Run Roleplay audio inventory (read-only)
        if: steps.credentials.outputs.enabled == 'true'
        run: npx tsx scripts/audit_orphan_audio.ts
