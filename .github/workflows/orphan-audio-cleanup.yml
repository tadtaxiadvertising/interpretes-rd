name: 🔎 Roleplay response-audio inventory (read-only)

# No deletion option: all Storage reconciliation is read-only until issue
# #408 defines age-gated, concurrency-safe cleanup for recordings.
on:
  schedule:
    - cron: '0 3 * * 0' # Weekly, Sunday 03:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Read-only Roleplay response-audio inventory
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # The secrets context is not available in a job-level "if" expression.
      # Resolve optional credentials in a step and skip all work when absent.
      - name: Check audit credentials
        id: credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Roleplay audio inventory skipped: SUPABASE_SERVICE_ROLE_KEY is not configured."
          fi

      - name: Checkout code
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.credentials.outputs.enabled == 'true'
        run: npm ci --legacy-peer-deps

      - name: Run Roleplay response-audio inventory (read-only)
        if: steps.credentials.outputs.enabled == 'true'
        run: npx tsx scripts/audit_orphan_audio.ts
