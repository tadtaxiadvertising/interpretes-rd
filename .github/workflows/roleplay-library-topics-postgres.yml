name: Isolated roleplay library topics PostgreSQL

on:
  pull_request:
    paths:
      - 'docs/staged-sql/roleplay-library-editorial-topics.sql'
      - 'src/app/api/admin/roleplays/library/**'
      - 'src/lib/roleplay-library-topics*'
      - 'scripts/ci/verify-roleplay-library-topics-postgres.sh'
      - '.github/workflows/roleplay-library-topics-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: roleplay_topics_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-fixture-only
        options: >-
          --health-cmd "pg_isready -U postgres -d roleplay_topics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify staged SQL on disposable PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci/verify-roleplay-library-topics-postgres.sh
