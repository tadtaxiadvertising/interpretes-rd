name: Express dependency remediation candidate (isolated)
on:
  pull_request:
    paths:
      - '.github/workflows/api-dependency-candidate.yml'
      - 'interpreters-api/package.json'
      - 'interpreters-api/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-dependency-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve candidate lockfiles without install scripts
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/api-dependency-candidate"
          mkdir -p "$dir/baseline" "$dir/bcrypt" "$dir/combined" "$dir/patched"
          for scope in baseline bcrypt combined; do
            cp interpreters-api/package.json interpreters-api/package-lock.json "$dir/$scope/"
          done
          export npm_config_registry=https://registry.npmjs.org/
          export npm_config_fetch_retries=1
          export npm_config_fetch_timeout=30000
          (
            cd "$dir/bcrypt"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps --save-exact bcrypt@6.0.0
          )
          cp "$dir/bcrypt/package.json" "$dir/bcrypt/package-lock.json" "$dir/combined/"
          (
            cd "$dir/combined"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps --save-exact @prisma/client@7.10.1 @prisma/adapter-pg@7.10.1
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps --save-dev --save-exact prisma@7.10.1
          )
          cp "$dir/combined/package.json" "$dir/combined/package-lock.json" "$dir/patched/"
          (
            cd "$dir/patched"
            # Stay on Express 4 and Zod 4; target the exact advisories observed.
            # The effect and brace-expansion versions match the root lockfile.
            npm pkg set 'overrides.proxy-addr=2.0.8' 'overrides.body-parser=1.20.9' 'overrides.qs=6.16.1' 'overrides.effect=3.22.3' 'overrides.brace-expansion@1=1.1.21'
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps --save-exact express@4.22.3 zod@4.6.7
          )
      - name: Compare full and production dependency audits
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/api-dependency-candidate"
          parser="$GITHUB_WORKSPACE/scripts/ci/evaluate-dependency-audit.mjs"
          export npm_config_registry=https://registry.npmjs.org/
          export npm_config_fetch_retries=1
          export npm_config_fetch_timeout=30000
          candidate_failed=0
          for scope in baseline bcrypt combined patched; do
            for mode in full runtime; do
              echo "Audit scope: $scope / $mode"
              report="$dir/$scope-$mode.json"
              flags=()
              if [ "$mode" = runtime ]; then flags+=(--omit=dev); fi
              (cd "$dir/$scope" && npm audit --package-lock-only --ignore-scripts --json "${flags[@]}") > "$report" || true
              if node "$parser" "$report"; then
                echo "$scope / $mode: PASS" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "$scope / $mode: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
                if [ "$scope" = patched ]; then candidate_failed=1; fi
              fi
              rm -f "$report"
            done
          done
          exit "$candidate_failed"
      - name: Retain candidate manifests for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dependency-candidates
          path: |
            ${{ runner.temp }}/api-dependency-candidate/bcrypt/package.json
            ${{ runner.temp }}/api-dependency-candidate/bcrypt/package-lock.json
            ${{ runner.temp }}/api-dependency-candidate/combined/package.json
            ${{ runner.temp }}/api-dependency-candidate/combined/package-lock.json
            ${{ runner.temp }}/api-dependency-candidate/patched/package.json
            ${{ runner.temp }}/api-dependency-candidate/patched/package-lock.json
          if-no-files-found: error
          retention-days: 3
